# Neon PostgreSQL
spring.datasource.url=${NEON_DATABASE_URL:jdbc:postgresql://ep-fancy-star-a2hiutp0-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}

spring.datasource.username=${NEON_DATABASE_USERNAME:neondb_owner}
spring.datasource.password=${NEON_DATABASE_PASSWORD:npg_vjH6ThY2qblZ}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE