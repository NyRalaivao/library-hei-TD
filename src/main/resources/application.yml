spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/library_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:azerty}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# AWS configuration (overridden in deployment via env vars)
aws:
  region: ${AWS_REGION:eu-west-3}
  ses:
    source: ${AWS_SES_SOURCE:no-reply@example.com}
  s3:
    bucket: ${AWS_S3_BUCKET:dummy-bucket}
